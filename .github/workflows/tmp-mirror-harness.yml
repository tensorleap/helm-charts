# TEMPORARY - delete before review. Runs the new reusable workflow from this branch.
name: TMP mirror harness
on:
  push:
    branches: [mirror-third-party-images]
jobs:
  copy:
    uses: ./.github/workflows/mirror_images.yml
    with:
      mode: copy
    permissions:
      id-token: write
      contents: read
  verify:
    needs: copy
    uses: ./.github/workflows/mirror_images.yml
    with:
      mode: verify
    permissions:
      id-token: write
      contents: read
