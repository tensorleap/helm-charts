name: ECR Public Cleanup

# Deletes images from public.ecr.aws/tensorleap. ECR Public has no lifecycle
# policies, so this is the only way images ever leave the registry. The logic
# lives in scripts/ecr-public-cleanup.py; this workflow only wires inputs,
# credentials and reporting around it.
#
# Two ways in:
#   * schedule: every Sunday night (Israel time) it REALLY DELETES with the
#     defaults below: all four repos, feature + untagged images at least 90
#     days old, chart pins protected. The schedule itself is the approval.
#   * workflow_dispatch: dry run by default; a real deletion needs dry_run
#     unchecked AND the exact confirm phrase.
# Nothing younger than 90 days can be deleted either way; the script enforces
# the same floor.

on:
  schedule:
    - cron: "0 20 * * 0"  # Sunday 20:00 UTC = 23:00 Israel (summer) / 22:00 (winter)
  workflow_dispatch:
    inputs:
      repos:
        description: "'all' = engine, engine-generic, node-server, web-ui | or a comma-separated subset of those four. No other repository can be cleaned."
        required: false
        default: "all"
      classes:
        description: "Comma-separated classes to delete: feature, untagged, master. Version images (tags like 1.6.72-...) are never deletable. master must be added explicitly."
        required: false
        default: "feature,untagged"
      older_than_days:
        description: "Only images pushed at least this many days ago. Hard minimum 90; lower values are refused."
        required: false
        default: "90"
      dry_run:
        description: "checked = plan only: list what would be deleted, delete nothing | unchecked = really delete (requires confirm)"
        required: false
        type: boolean
        default: true
      confirm:
        description: "Type exactly DELETE FROM PUBLIC ECR to allow a real deletion. Ignored when dry_run is checked."
        required: false
        default: ""
      protect_chart_pins:
        description: "checked = never delete the tags pinned by *-latest-image on master (plus their engine-generic variants) | unchecked = no protection beyond version tags"
        required: false
        type: boolean
        default: true

# Two overlapping runs would race on the same digests; queue them instead.
concurrency:
  group: ecr-public-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      # Scheduled runs have no inputs, so every value falls back to the defaults
      # and the run is a real deletion (dry_run=false, confirm phrase supplied).
      SCHEDULED: ${{ github.event_name == 'schedule' }}
      REPOS: ${{ inputs.repos || 'all' }}
      CLASSES: ${{ inputs.classes || 'feature,untagged' }}
      OLDER_THAN_DAYS: ${{ inputs.older_than_days || '90' }}
      DRY_RUN_INPUT: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
      CONFIRM: ${{ github.event_name == 'schedule' && 'DELETE FROM PUBLIC ECR' || inputs.confirm }}
      MIN_OLDER_THAN_DAYS: "90"
      OUT_DIR: ecr-public-cleanup-out
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$OLDER_THAN_DAYS" =~ ^[0-9]+$ ]] || [ "$OLDER_THAN_DAYS" -lt "$MIN_OLDER_THAN_DAYS" ]; then
            echo "❌ older_than_days=$OLDER_THAN_DAYS is below the hard minimum of $MIN_OLDER_THAN_DAYS days; refusing" >&2
            exit 1
          fi
          if [ "$SCHEDULED" = "true" ]; then
            echo "⏰ SCHEDULED REAL DELETION with defaults: repos=$REPOS classes=$CLASSES older_than_days=$OLDER_THAN_DAYS"
          elif [ "$DRY_RUN_INPUT" = "true" ]; then
            echo "🧪 DRY RUN: listing only, nothing will be deleted"
          elif [ "$CONFIRM" = "DELETE FROM PUBLIC ECR" ]; then
            echo "🔥 REAL DELETION requested by ${{ github.actor }}: repos=$REPOS classes=$CLASSES older_than_days=$OLDER_THAN_DAYS"
          else
            echo "❌ dry_run is unchecked but confirm is not exactly 'DELETE FROM PUBLIC ECR'; refusing to delete" >&2
            exit 1
          fi

      # Same static key release_airgap_pack.yml uses: IAM user "helm-charts" in the
      # utils account (aws-env terraform/global/helm-charts-iam.tf), which owns the
      # public registry. To move to OIDC later: add `id-token: write` under
      # permissions and replace the two key inputs with
      # `role-to-assume: arn:aws:iam::170591776583:role/<role>`.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # The chart on master pins one master-<sha> tag per component. Deleting those
      # would break `leap server install` for everyone, so turn them into keep globs
      # that also cover the -amd64/-arm64/-stable and engine-generic -py3x variants.
      # (pippin is pinned too, but this workflow never touches the pippin repo.)
      - name: Build keep-file from chart pins
        if: ${{ github.event_name == 'schedule' || inputs.protect_chart_pins }}
        shell: bash
        run: |
          set -euo pipefail
          : > keep.txt
          for repo in engine node-server web-ui; do
            ref="$(cat "${repo}-latest-image")"
            tag="${ref##*:}"
            echo "${repo}:${tag}*" >> keep.txt
            if [ "$repo" = "engine" ]; then
              echo "engine-generic:${tag}*" >> keep.txt
            fi
          done
          echo "🔒 protecting chart pins:"
          cat keep.txt

      - name: Run cleanup
        shell: bash
        run: |
          set -euo pipefail
          args=(--repos "$REPOS" --classes "$CLASSES" --older-than-days "$OLDER_THAN_DAYS" --out "$OUT_DIR")
          if [ -f keep.txt ]; then
            args+=(--keep-file keep.txt)
          fi
          if [ "$DRY_RUN_INPUT" != "true" ]; then
            args+=(--no-dry-run --confirm "$CONFIRM")
          fi
          python3 scripts/ecr-public-cleanup.py "${args[@]}"

      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f "$OUT_DIR/summary.md" ]; then
            cat "$OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary produced (the run failed before scanning)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecr-public-cleanup-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}/
          retention-days: 90
          if-no-files-found: ignore
