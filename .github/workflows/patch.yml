name: Patch

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "checked = bump the version number: 1.6.57-rc.1 → 1.6.58-rc.0, cuts branch 1.6.58 | unchecked = bump the rc number only: 1.6.57-rc.1 → 1.6.57-rc.2, stays on branch 1.6.57"
        required: false
        type: boolean
        default: true
      custom_tag_prefix:
        description: "Custom tag prefix for manifest"
        required: false
        default: ""

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      branch: ${{ steps.checkout_patch_branch.outputs.patch_branch }}
      check_cli: ${{ steps.cli.outputs.check_cli }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:   
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.TENSORLEAP_OPS_GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
        shell: bash

      - name: Bump patch version and checkout patch branch
        id: checkout_patch_branch
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          # checkout-patch-branch bumps the patch version (1.6.57* -> 1.6.58-rc.0), or with
          # BUMP=false only the rc suffix (1.6.57-rc.1 -> 1.6.57-rc.2). It prints the branch
          # name on the first line, the is_new_branch flag on the second and the branch it was
          # cut from on the third.
          OUTPUT="$(make -s checkout-patch-branch)"
          BRANCH="$(echo "$OUTPUT" | sed -n 1p)"
          IS_NEW_BRANCH="$(echo "$OUTPUT" | sed -n 2p)"
          BASE_BRANCH="$(echo "$OUTPUT" | sed -n 3p)"
          if [ -z "$BRANCH" ]; then
            echo "Error: Failed to get branch name from checkout-patch-branch" >&2
            exit 1
          fi
          echo "patch_branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "is_new_branch=$IS_NEW_BRANCH" >> "$GITHUB_OUTPUT"
          echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"
        shell: bash

      # Only the newest version gets a leap-cli (Release Production releases none
      # for an older line), so only that one has a CLI to check.
      - name: Decide whether to check leap-cli
        id: cli
        env:
          VERSION: ${{ steps.checkout_patch_branch.outputs.patch_branch }}
        run: |
          source scripts/lib/release-common.sh
          latest="$(latest_production_version)"
          if [ -n "$latest" ] && [ "$(version_cmp "$VERSION" "$latest")" = -1 ]; then
            echo "check_cli=false" >> "$GITHUB_OUTPUT"
            echo "::notice::leap-cli is not checked: ${VERSION} is older than the latest release ${latest}, whose CLI stays latest"
          else
            echo "check_cli=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Get new version
        id: get_version
        run: |
          NEW_VERSION=$(grep -E '^version:' charts/tensorleap/Chart.yaml | awk '{print $2}')
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      # Cut the same version branch in engine/node-server/web-ui/leap-cli, off the branch this
      # patch is based on (e.g. 1.6.58 from 1.6.57) so the patch carries the version
      # branch state and not master. Idempotent - existing branches are left as is.
      - name: Create external patch branches
        run: |
          make create-external-rc-branches
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.TENSORLEAP_OPS_GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.checkout_patch_branch.outputs.patch_branch }}
          BASE_BRANCH: ${{ steps.checkout_patch_branch.outputs.base_branch }}

      - name: Notify Slack about new patch branches
        if: steps.checkout_patch_branch.outputs.is_new_branch == 'true'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_TOKEN }}
          errors: true
          payload: |
            channel: C0AAMFVFYM6
            text: "🩹 New Patch Branch Created: ${{ steps.checkout_patch_branch.outputs.patch_branch }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "🩹 New Patch Branch Created: ${{ steps.checkout_patch_branch.outputs.patch_branch }}"
                  emoji: true
              - type: section
                text:
                  type: mrkdwn
                  text: "*Patched from:* `${{ steps.checkout_patch_branch.outputs.base_branch }}`\n*Branch Links:*\n• <https://github.com/tensorleap/helm-charts/tree/${{ steps.checkout_patch_branch.outputs.patch_branch }}|helm-charts>\n• <https://github.com/tensorleap/engine/tree/${{ steps.checkout_patch_branch.outputs.patch_branch }}|engine>\n• <https://github.com/tensorleap/node-server/tree/${{ steps.checkout_patch_branch.outputs.patch_branch }}|node-server>\n• <https://github.com/tensorleap/web-ui/tree/${{ steps.checkout_patch_branch.outputs.patch_branch }}|web-ui>\n• <https://github.com/tensorleap/leap-cli/tree/${{ steps.checkout_patch_branch.outputs.patch_branch }}|leap-cli>"

      - name: Update charts with branch images
        uses: ./.github/actions/update-images-from-branch
        with:
          branch: ${{ steps.checkout_patch_branch.outputs.patch_branch }}
          github_token: ${{ secrets.TENSORLEAP_OPS_GITHUB_TOKEN }}

      # Release Production's preflight check, on the images this patch ships:
      # a web-ui that expects an API the node-server doesn't ship stops here,
      # before the RC is committed or published, instead of at the production
      # release.
      - name: Check web-ui's api-client against the shipped node-server
        env:
          GH_TOKEN: ${{ secrets.TENSORLEAP_OPS_GITHUB_TOKEN }}
        run: ./scripts/check-release-contracts.sh
        shell: bash

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Extract image names
        run: |
          make build-helm
          make update-images
        shell: bash

      - name: Validate images.txt
        run: make validate-images
        shell: bash

      # Disabled: helm lint errors because the local subcharts (tensorleap-engine,
      # tensorleap-node-server, tensorleap-web-ui) are committed as directories and
      # intentionally not declared in Chart.yaml dependencies. Matches release_candidate.yml.
      # - name: Helm Chart Validation (Tensorleap)
      #   uses: tensorleap/reusable-workflows/actions/helm-validate@master
      #   with:
      #     chart_path: './charts/tensorleap'

      # - name: Helm Chart Validation (Tensorleap Infra)
      #   uses: tensorleap/reusable-workflows/actions/helm-validate@master
      #   with:
      #     chart_path: './charts/tensorleap-infra'

      - name: Commit version changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "Bump patch version to ${{ steps.get_version.outputs.version }} and update images.txt"
          github_token: ${{ secrets.TENSORLEAP_OPS_GITHUB_TOKEN }}

  # Builds and tests the leap-cli Release Production would ship for this RC and
  # pushes nothing: the API client regenerated from the RC's node-server, the
  # RC branch's installer code, the current skills. It waits for the
  # node-server image of a branch that was only just cut.
  cli-dry-run:
    name: Dry-run leap-cli
    needs: patch
    if: needs.patch.outputs.check_cli == 'true'
    uses: ./.github/workflows/_release_cli.yml
    with:
      tensorleap_version: ${{ needs.patch.outputs.branch }}
      dry_run: true
      cli_artifact: leap-cli-rc
    secrets: inherit

  # The branches are cut and the bump is committed by now; the RC itself is
  # published only when the dry run passed. A CLI that doesn't build stops the
  # RC here, as it would stop the production release. Fix it and re-run the
  # failed jobs.
  release:
    name: Release the RC
    needs: [patch, cli-dry-run]
    # cli-dry-run is skipped for a version older than the latest release; only
    # its failure stops the RC.
    if: ${{ !cancelled() && needs.patch.result == 'success' && (needs.cli-dry-run.result == 'success' || needs.cli-dry-run.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release actions are read from the workspace and check the branch
      # out again themselves.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.patch.outputs.branch }}
          token: ${{ secrets.TENSORLEAP_OPS_GITHUB_TOKEN }}

      - name: Release Charts
        uses: ./.github/actions/release-chart
        with:
          github_token: ${{ secrets.TENSORLEAP_OPS_GITHUB_TOKEN }}
          branch: ${{ needs.patch.outputs.branch }}

      - name: Release Manifest
        uses: ./.github/actions/release-manifest
        with:
          github_token: ${{ secrets.TENSORLEAP_OPS_GITHUB_TOKEN }}
          custom_tag_prefix: ${{ inputs.custom_tag_prefix }}
          branch: ${{ needs.patch.outputs.branch }}

  # Installs the RC with the CLI the dry run built, so the installer code this
  # RC carries is the one tested. When the dry run was skipped cli_artifact is
  # empty and the latest released leap-cli is used.
  install-server:
    needs: [patch, cli-dry-run, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    uses: ./.github/workflows/_install_server.yml
    with:
      tag: ${{ inputs.custom_tag_prefix && format('{0}-{1}', inputs.custom_tag_prefix, needs.patch.outputs.version) || needs.patch.outputs.version }}
      cli_artifact: ${{ needs.cli-dry-run.outputs.cli_artifact }}
