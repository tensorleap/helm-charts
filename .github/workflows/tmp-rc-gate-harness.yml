# Temporary: the Release Candidate jobs with a stand-in for the cut. Deleted before review.
name: TMP RC gate harness
'on':
  push:
    branches:
    - release-candidate-current-cli-checks
jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      version: "${{ steps.source.outputs.version }}"
      release_ref: "${{ steps.source.outputs.release_ref }}"
      check_cli: "${{ steps.cli.outputs.check_cli }}"
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Find what this RC is cut from
      id: source
      run: |
        set -euo pipefail
        version="$(grep -E '^version:' charts/tensorleap/Chart.yaml | awk '{print $2}' | sed 's/-rc\.[0-9]*$//')"
        if [ "$GITHUB_REF_NAME" = "master" ] && git rev-parse -q --verify "refs/remotes/origin/${version}" >/dev/null; then
          release_ref="refs/heads/${version}"
          git checkout -q --detach "origin/${version}"
        else
          release_ref="$GITHUB_SHA"
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "release_ref=${release_ref}" >> "$GITHUB_OUTPUT"
        echo "RC of ${version}, cut from ${release_ref}"
      shell: bash
    - name: Check web-ui's api-client against the shipped node-server
      env:
        GH_TOKEN: "${{ secrets.TENSORLEAP_OPS_GITHUB_TOKEN }}"
      run: "./scripts/check-release-contracts.sh"
      shell: bash
    - name: Decide whether to check leap-cli
      id: cli
      env:
        VERSION: "${{ steps.source.outputs.version }}"
      run: |
        source scripts/lib/release-common.sh
        latest="$(latest_production_version)"
        if [ -n "$latest" ] && [ "$(version_cmp "$VERSION" "$latest")" = -1 ]; then
          echo "check_cli=false" >> "$GITHUB_OUTPUT"
          echo "::notice::leap-cli is not checked: ${VERSION} is older than the latest release ${latest}, whose CLI stays latest"
        else
          echo "check_cli=true" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
  cli-dry-run:
    name: Dry-run leap-cli
    needs: preflight
    if: needs.preflight.outputs.check_cli == 'true'
    uses: "./.github/workflows/_release_cli.yml"
    with:
      tensorleap_version: "${{ needs.preflight.outputs.version }}"
      release_ref: "${{ needs.preflight.outputs.release_ref }}"
      dry_run: true
      cli_artifact: leap-cli-rc
    secrets: inherit
  release:
    needs:
    - preflight
    - cli-dry-run
    if: "${{ !cancelled() && needs.preflight.result == 'success' && (needs.cli-dry-run.result
      == 'success' || needs.cli-dry-run.result == 'skipped') }}"
    runs-on: ubuntu-latest
    outputs:
      version: 1.6.114-rc.1
    steps:
    - name: Stand-in for cutting and publishing the RC
      run: echo would cut the RC now
  install-server:
    needs:
    - release
    - cli-dry-run
    if: "${{ !cancelled() && needs.release.result == 'success' }}"
    uses: "./.github/workflows/_install_server.yml"
    with:
      tag: "${{ inputs.custom_tag_prefix && format('{0}-{1}', inputs.custom_tag_prefix,
        needs.release.outputs.version) || needs.release.outputs.version }}"
      cli_artifact: "${{ needs.cli-dry-run.outputs.cli_artifact }}"
  bad-dry-run:
    name: Dry-run that must fail
    needs: preflight
    if: needs.preflight.outputs.check_cli == 'true'
    uses: "./.github/workflows/_release_cli.yml"
    with:
      tensorleap_version: "${{ needs.preflight.outputs.version }}"
      release_ref: refs/heads/no-such-branch
      dry_run: true
      cli_artifact: leap-cli-bad
    secrets: inherit
  release-after-bad:
    needs:
    - preflight
    - bad-dry-run
    if: "${{ !cancelled() && needs.preflight.result == 'success' && (needs.bad-dry-run.result
      == 'success' || needs.bad-dry-run.result == 'skipped') }}"
    runs-on: ubuntu-latest
    steps:
    - name: Must be skipped
      run: echo THIS MUST NOT RUN; exit 1
