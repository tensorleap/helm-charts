name: Release Candidate

on:
  workflow_call:
    inputs:
      custom_tag_prefix:
        description: "Custom tag"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      custom_tag_prefix:
        description: "Custom tag"
        required: false
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      branch: ${{ steps.checkout_rc_branch.outputs.rc_branch }}
      check_cli: ${{ steps.cli.outputs.check_cli }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.TENSORLEAP_OPS_GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
        shell: bash

      # Release Production's preflight check, run before anything is cut: a
      # web-ui that expects an API the node-server doesn't ship is then fixed on
      # master, not with a Patch on the version branches.
      - name: Check web-ui's api-client against the shipped node-server
        env:
          GH_TOKEN: ${{ secrets.TENSORLEAP_OPS_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # From master, an RC of a version whose branch exists is cut from that
          # branch, so those are the image tags to check.
          version="$(grep -E '^version:' charts/tensorleap/Chart.yaml | awk '{print $2}' | sed 's/-rc\.[0-9]*$//')"
          if [ "$GITHUB_REF_NAME" = "master" ] && git rev-parse -q --verify "refs/remotes/origin/${version}" >/dev/null; then
            echo "Checking the image tags of the existing ${version} branch"
            mkdir "$RUNNER_TEMP/rc-charts"
            git archive "origin/${version}" charts/tensorleap/charts/node-server/values.yaml charts/tensorleap/charts/web-ui/values.yaml \
              | tar -x -C "$RUNNER_TEMP/rc-charts"
            cd "$RUNNER_TEMP/rc-charts"
          fi
          "$GITHUB_WORKSPACE/scripts/check-release-contracts.sh"
        shell: bash

      - name: Checkout RC branch
        id: checkout_rc_branch
        run: |
          set -euo pipefail
          IS_NEW_BRANCH="false"
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "Running from master - using checkout-rc-branch"
            OUTPUT="$(make -s checkout-rc-branch)"
            BRANCH="$(echo "$OUTPUT" | head -1)"
            IS_NEW_BRANCH="$(echo "$OUTPUT" | tail -1)"
            if [ -z "$BRANCH" ]; then
              echo "Error: Failed to get branch name from checkout-rc-branch" >&2
              exit 1
            fi
          else
            echo "Running from branch: ${{ github.ref_name }} - using selected branch"
            BRANCH="${{ github.ref_name }}"
            # Still bump RC version for non-master branches
            make bump-rc-version
          fi
          echo "rc_branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "is_new_branch=$IS_NEW_BRANCH" >> "$GITHUB_OUTPUT"
        shell: bash

      # Only the newest version gets a leap-cli (Release Production releases none
      # for an older line), so only that one has a CLI to check.
      - name: Decide whether to check leap-cli
        id: cli
        env:
          VERSION: ${{ steps.checkout_rc_branch.outputs.rc_branch }}
        run: |
          source scripts/lib/release-common.sh
          latest="$(latest_production_version)"
          if [ -n "$latest" ] && [ "$(version_cmp "$VERSION" "$latest")" = -1 ]; then
            echo "check_cli=false" >> "$GITHUB_OUTPUT"
            echo "::notice::leap-cli is not checked: ${VERSION} is older than the latest release ${latest}, whose CLI stays latest"
          else
            echo "check_cli=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Create external RC branches
        if: steps.checkout_rc_branch.outputs.is_new_branch == 'true'
        run: |
          make create-external-rc-branches
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.TENSORLEAP_OPS_GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.checkout_rc_branch.outputs.rc_branch }}

      - name: Notify Slack about new RC branches
        if: steps.checkout_rc_branch.outputs.is_new_branch == 'true'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_TOKEN }}
          errors: true
          payload: |
            channel: C0AAMFVFYM6
            text: "🚀 New RC Branch Created: ${{ steps.checkout_rc_branch.outputs.rc_branch }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "🚀 New RC Branch Created: ${{ steps.checkout_rc_branch.outputs.rc_branch }}"
                  emoji: true
              - type: section
                text:
                  type: mrkdwn
                  text: "*Branch Links:*\n• <https://github.com/tensorleap/helm-charts/tree/${{ steps.checkout_rc_branch.outputs.rc_branch }}|helm-charts>\n• <https://github.com/tensorleap/engine/tree/${{ steps.checkout_rc_branch.outputs.rc_branch }}|engine>\n• <https://github.com/tensorleap/node-server/tree/${{ steps.checkout_rc_branch.outputs.rc_branch }}|node-server>\n• <https://github.com/tensorleap/web-ui/tree/${{ steps.checkout_rc_branch.outputs.rc_branch }}|web-ui>\n• <https://github.com/tensorleap/leap-cli/tree/${{ steps.checkout_rc_branch.outputs.rc_branch }}|leap-cli>"

      - name: Sync tensorleap-infra chart from master
        run: |
          git fetch origin master
          git checkout origin/master -- charts/tensorleap-infra/
        shell: bash

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Extract image names
        run: |
          make build-helm
          make update-images
        shell: bash

      # - name: Validate images.txt
      #   run: make validate-images
      #   shell: bash

      # - name: Helm Chart Validation (Tensorleap)
      #   uses: tensorleap/reusable-workflows/actions/helm-validate@master
      #   with:
      #     chart_path: './charts/tensorleap'

      # - name: Helm Chart Validation (Tensorleap Infra)
      #   uses: tensorleap/reusable-workflows/actions/helm-validate@master
      #   with:
      #     chart_path: './charts/tensorleap-infra'

      - name: Get chart version
        id: get_version
        run: |
          CHART_VERSION=$(grep -E '^version:' charts/tensorleap/Chart.yaml | awk '{print $2}')
          echo "version=$CHART_VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Commit RC branch state and updated images
        uses: EndBug/add-and-commit@v9
        with:
          message: "Release candidate branch: ${{ steps.checkout_rc_branch.outputs.rc_branch }} and update images.txt"
          github_token: ${{ secrets.TENSORLEAP_OPS_GITHUB_TOKEN }}

      - name: Release Charts
        uses: ./.github/actions/release-chart
        with:
          github_token: ${{ secrets.TENSORLEAP_OPS_GITHUB_TOKEN }}
          branch: ${{ steps.checkout_rc_branch.outputs.rc_branch }}

      - name: Release Candidate Manifest
        uses: ./.github/actions/release-manifest
        with:
          github_token: ${{ secrets.TENSORLEAP_OPS_GITHUB_TOKEN }}
          custom_tag_prefix: ${{ inputs.custom_tag_prefix }}
          branch: ${{ steps.checkout_rc_branch.outputs.rc_branch }}

  # Builds and tests the leap-cli Release Production would ship for this RC and
  # pushes nothing: the API client regenerated from the RC's node-server, the
  # RC branch's installer code, the current skills. What fails here would stop
  # the production release, so it shows while the fix is still a cherry-pick.
  cli-dry-run:
    name: Dry-run leap-cli
    needs: release
    if: needs.release.outputs.check_cli == 'true'
    uses: ./.github/workflows/_release_cli.yml
    with:
      tensorleap_version: ${{ needs.release.outputs.branch }}
      dry_run: true
      cli_artifact: leap-cli-rc
    secrets: inherit

  # Installs the RC with the CLI built above, so the installer code this RC
  # carries is the one tested. Without one (dry run skipped or failed)
  # cli_artifact is empty and the latest released leap-cli is used, as before.
  install-server:
    needs: [release, cli-dry-run]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    uses: ./.github/workflows/_install_server.yml
    with:
      tag: ${{ inputs.custom_tag_prefix && format('{0}-{1}', inputs.custom_tag_prefix, needs.release.outputs.version) || needs.release.outputs.version }}
      cli_artifact: ${{ needs.cli-dry-run.outputs.cli_artifact }}
