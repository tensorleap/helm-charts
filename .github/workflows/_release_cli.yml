name: Release CLI

# Releases leap-cli for a production version:
#   1. regenerates its Go API client from the node-server image the release ships
#   2. pins the installer module (this repo) to the release's installer tag
#   3. builds and tests, commits to leap-cli's version branch and pushes the next
#      v0.0.N tag - which runs leap-cli's own "Create release"
#
# Release Production calls it twice: as a dry run before anything is published,
# so a CLI that doesn't build blocks the release, then for real once the chart
# and manifest are out. Dispatch it by hand to re-run a failed CLI release, or to
# ship a CLI-only fix cherry-picked onto the newest leap-cli version branch.

on:
  workflow_call:
    inputs:
      version:
        description: "Production version, e.g. 1.6.86 - also the branch name in helm-charts and leap-cli"
        required: true
        type: string
      dry_run:
        description: "Regenerate, build and test only; push nothing"
        required: false
        default: false
        type: boolean
    outputs:
      cli_tag:
        description: "The released leap-cli tag (empty on a dry run)"
        value: ${{ jobs.release-cli.outputs.cli_tag }}
      installer_version:
        description: "The installer module version the CLI pins"
        value: ${{ jobs.release-cli.outputs.installer_version }}
      api_version:
        description: "The node-server API version the client was generated from"
        value: ${{ jobs.release-cli.outputs.api_version }}
  workflow_dispatch:
    inputs:
      version:
        description: "Released production version, e.g. 1.6.86 (must be the newest release)"
        required: true
        type: string
      dry_run:
        description: "Regenerate, build and test only; push nothing"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release-cli:
    name: ${{ inputs.dry_run && 'Dry-run leap-cli' || 'Release leap-cli' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The next v0.0.N comes from the existing tags, so real releases go one at a time.
    concurrency:
      group: ${{ inputs.dry_run && format('leap-cli-dry-run-{0}', github.run_id) || 'leap-cli-release' }}
      cancel-in-progress: false
    outputs:
      cli_tag: ${{ steps.tag.outputs.cli_tag }}
      installer_version: ${{ steps.installer.outputs.installer_version }}
      api_version: ${{ steps.regen.outputs.api_version }}
    env:
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      # Reads the private service repos, and pushes to leap-cli: unlike
      # GITHUB_TOKEN, a tag pushed with it triggers leap-cli's release workflow.
      GH_TOKEN: ${{ secrets.TENSORLEAP_OPS_GITHUB_TOKEN }}
    steps:
      # Scripts come from the ref this workflow runs from, release data from the
      # version branch's current head - which on the real run already carries the
      # release commit (version-pinned images, installer version).
      - name: Check out helm-charts tooling
        uses: actions/checkout@v4
        with:
          path: tools

      - name: Check out the release branch
        uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ inputs.version }}
          path: release
          fetch-depth: 0

      # Only the newest release may publish a CLI: install.sh and `leap cli
      # upgrade` hand everyone the latest one.
      - name: Refuse an unreleased or older version
        if: ${{ !inputs.dry_run }}
        working-directory: release
        run: |
          source ../tools/scripts/lib/release-common.sh
          gh release view "manifest-${VERSION}" --repo tensorleap/helm-charts >/dev/null 2>&1 \
            || die "manifest-${VERSION} is not released - release the version first"
          latest="$(latest_production_version)"
          [ "$latest" = "$VERSION" ] \
            || die "${VERSION} is not the newest production release (${latest} is); its CLI would replace a newer one as latest"

      - name: Find the leap-cli version branch
        id: leap_cli
        run: |
          if gh api "repos/tensorleap/leap-cli/branches/${VERSION}" >/dev/null 2>&1; then
            echo "ref=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::leap-cli has no ${VERSION} branch; starting it from master"
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out leap-cli
        uses: actions/checkout@v4
        with:
          repository: tensorleap/leap-cli
          ref: ${{ steps.leap_cli.outputs.ref }}
          path: leap-cli
          fetch-depth: 0
          token: ${{ secrets.TENSORLEAP_OPS_GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: leap-cli/go.mod
          cache-dependency-path: leap-cli/go.sum

      - name: Regenerate the API client from the shipped node-server
        id: regen
        run: |
          source tools/scripts/lib/release-common.sh
          tag="$(read_value release/charts/tensorleap/charts/node-server/values.yaml image_tag)"
          tools/scripts/regen-leap-cli-api.sh "$tag" leap-cli

      - name: Pin the installer module
        id: installer
        run: |
          source tools/scripts/lib/release-common.sh
          installer="$(installer_version_of release)"
          if [ -n "$DRY_RUN" ]; then
            # The release commit and its installer tag don't exist yet. Build
            # against the code they will be made from: only the Version constant
            # can still move.
            (cd leap-cli && go mod edit -replace "github.com/tensorleap/helm-charts=../release" && go mod tidy)
            echo "installer_version=${installer} (unreleased, $(git -C release rev-parse --short HEAD))" >> "$GITHUB_OUTPUT"
          else
            git -C release rev-parse -q --verify "refs/tags/${installer}" >/dev/null \
              || die "installer tag ${installer} does not exist - Release Production creates it"
            (cd release && installer_code_matches "$installer") \
              || die "installer code on ${VERSION} changed after ${installer} was tagged - ship it as a patch release (Patch, then Release Production)"
            # Fetch straight from GitHub so a tag pushed minutes ago doesn't wait
            # on the module proxy; go.sum hashes are content-based either way.
            (cd leap-cli \
              && GOPRIVATE=github.com/tensorleap/helm-charts go get "github.com/tensorleap/helm-charts@${installer}" \
              && GOPRIVATE=github.com/tensorleap/helm-charts go mod tidy)
            echo "installer_version=${installer}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test leap-cli
        working-directory: leap-cli
        run: |
          make check-fmt
          go build -o /dev/null .
          make test

      - name: Summarize
        env:
          PREVIOUS_API: ${{ steps.regen.outputs.previous_api_version }}
          API: ${{ steps.regen.outputs.api_version }}
          INSTALLER: ${{ steps.installer.outputs.installer_version }}
          LEAP_CLI_REF: ${{ steps.leap_cli.outputs.ref }}
        run: |
          changed="$(git -C leap-cli status --porcelain -- go.mod go.sum pkg/tensorleapapi | wc -l | tr -d ' ')"
          {
            echo "### leap-cli for ${VERSION}${DRY_RUN:+ (dry run - nothing pushed)}"
            echo "- node-server API: ${PREVIOUS_API} → ${API}"
            echo "- installer: ${INSTALLER}"
            echo "- leap-cli \`${LEAP_CLI_REF}\`: ${changed} files changed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit to the leap-cli version branch
        if: ${{ !inputs.dry_run }}
        working-directory: leap-cli
        env:
          API: ${{ steps.regen.outputs.api_version }}
          INSTALLER: ${{ steps.installer.outputs.installer_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum pkg/tensorleapapi
          if git diff --cached --quiet; then
            echo "Nothing to commit: the branch already matches ${VERSION}"
          else
            git commit -q -m "Release ${VERSION}: installer ${INSTALLER}, node-server API ${API}"
          fi
          # Creates the branch when it started from master.
          git push origin "HEAD:refs/heads/${VERSION}"

      - name: Tag the CLI release
        id: tag
        if: ${{ !inputs.dry_run }}
        working-directory: leap-cli
        env:
          API: ${{ steps.regen.outputs.api_version }}
          INSTALLER: ${{ steps.installer.outputs.installer_version }}
        run: |
          # A re-run reuses the tag it already pushed.
          tag="$(git tag --points-at HEAD | grep -E '^v0\.0\.[0-9]+$' | sort -t. -k3,3n | tail -1 || true)"
          if [ -n "$tag" ]; then
            echo "HEAD is already tagged ${tag}"
          else
            # Only the v0.0.N line counts: stray v0.89, v0.10.14 and 0.0.90 tags
            # sort above it, and tag-only v0.0.160 still takes its number.
            last="$(git ls-remote --tags origin 'refs/tags/v0.0.*' \
              | sed -n 's#.*refs/tags/v0\.0\.\([0-9][0-9]*\)$#\1#p' | sort -n | tail -1)"
            if [ -z "$last" ]; then
              echo "::error::found no v0.0.N tags in tensorleap/leap-cli"
              exit 1
            fi
            tag="v0.0.$((last + 1))"
            git tag -a "$tag" -m "leap-cli ${tag} for Tensorleap ${VERSION} (installer ${INSTALLER}, node-server API ${API})"
            git push origin "refs/tags/${tag}"
          fi
          echo "cli_tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Wait for leap-cli's "Create release"
        if: ${{ !inputs.dry_run }}
        env:
          CLI_TAG: ${{ steps.tag.outputs.cli_tag }}
        run: tools/scripts/wait-for-cli-release.sh "$CLI_TAG"
