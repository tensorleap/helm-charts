ingress:
  enabled: true

ingress-nginx:
  enabled: true
  fullnameOverride: ingress-nginx
  controller:
    extraArgs:
      default-ssl-certificate: tensorleap/tls-secret
    image:
      digest: ""
    config:
      enable-snippets: "true"
      allow-snippet-annotations: "true"
    admissionWebhooks:
      patch:
        image:
          digest: ""
    # The controller writes its runtime state into /etc/ingress-controller:
    # the fake certificate, dhparam and per-secret PEMs under ssl/, annotation
    # auth files under auth/, and opentelemetry.toml under telemetry/ on every
    # config reload. The image ships all three as uid 101 mode 0755 — writable
    # only because the process owns them.
    # Those directories live in the containerd snapshot tree, bind-mounted from
    # the host (/var/lib/tensorleap/standalone/containerd), so any host-side
    # operation that does not preserve ownership — a data-dir move across
    # devices, a backup restore — leaves them owned by root, and the controller
    # then dies at startup with "unexpected error storing fake SSL Cert ...
    # permission denied" (ssl/), or comes up unable to reload NGINX with
    # "open /etc/ingress-controller/telemetry/opentelemetry.toml: permission
    # denied" until the liveness probe kills it. That state is sticky: it
    # survives pod deletion and reboots, because every new pod stacks on the
    # same on-disk layers.
    # Mount emptyDirs over the three paths instead. kubelet creates them fresh
    # per pod and fsGroup (www-data, gid 82) makes them group-writable, so
    # startup no longer depends on host snapshot ownership. geoip/ is
    # deliberately left alone: it is populated by an init container when
    # maxmindLicenseKey is set, and extraVolumeMounts only reaches the
    # controller container, so shadowing it would hide that download.
    # Ref BF-1092.
    podSecurityContext:
      fsGroup: 82
      fsGroupChangePolicy: OnRootMismatch
    extraVolumes:
      - name: ingress-controller-ssl
        emptyDir: {}
      - name: ingress-controller-auth
        emptyDir: {}
      - name: ingress-controller-telemetry
        emptyDir: {}
    extraVolumeMounts:
      - name: ingress-controller-ssl
        mountPath: /etc/ingress-controller/ssl
      - name: ingress-controller-auth
        mountPath: /etc/ingress-controller/auth
      - name: ingress-controller-telemetry
        mountPath: /etc/ingress-controller/telemetry
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"

global:
  # Set to true to install all resources strictly within the release namespace.
  # When true: node-server RBAC becomes Role (not ClusterRole), engine-cm and
  # node-server env get explicit namespace references, and no cluster-wide
  # resources are created. Use this for installing into existing shared
  # Kubernetes clusters. Default false preserves current k3d behavior.
  namespacedInstall: false
  target_namespace: ""
  storageClassName: ""
  create_local_volumes: true
  disable_auth: false
  domain: "localhost"
  basePath: ""
  url: "http://localhost"
  proxyUrl: ""
  # Set tls.enabled=true and provide cert/key for any non-loopback domain.
  # Keycloak refuses plaintext auth on non-loopback hosts, so leaving this off
  # with a real domain produces an "HTTPS required" page on first browser
  # login. The chart prints a NOTES warning on install when this combination
  # is detected, but does not block the install.
  tls:
    enabled: false
    cert: ""
    key: ""

  elasticsearch:
    enabled: true
    url: ""

  keycloakx:
    enabled: true

keycloakx:
  enabled: true
  replicas: 1
  cache:
    stack: custom # <— IMPORTANT

  command: ["/opt/keycloak/bin/kc.sh", "start"]

  # Disable the subchart's built-in KC_PROXY_HEADERS env var so our extraEnv
  # template (which sets it conditionally based on global.domain) is the sole
  # source.  Without this, the subchart emits KC_PROXY_HEADERS=forwarded first
  # and glibc's getenv() returns the first match, ignoring our override.
  proxy:
    enabled: false
    http:
      enabled: true

  fullnameOverride: keycloak
  ingress:
    enabled: false
  # make sure the container can write the volume (image runs as uid 1000)
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"

  extraEnv: |
    - name: KEYCLOAK_ADMIN
      value: "admin"
    - name: KEYCLOAK_ADMIN_PASSWORD
      value: "admin"
    - name: KC_DB
      value: "dev-file"
    - name: KC_CACHE
      value: "local"
    - name: KC_PROXY
      value: "edge"
    - name: KC_CACHE_STACK
      value: ""
    {{- if and .Values.global.domain (ne .Values.global.domain "localhost") }}
    - name: KC_HOSTNAME_STRICT
      value: "true"
    - name: KC_PROXY_HEADERS
      value: "xforwarded"
    {{- if .Values.global.proxyUrl }}
    - name: KC_HOSTNAME
      value: "{{ .Values.global.proxyUrl }}/auth"
    - name: KC_HOSTNAME_URL
      value: "{{ .Values.global.proxyUrl }}/auth"
    - name: KC_FRONTEND_URL
      value: "{{ .Values.global.proxyUrl }}/auth"
    {{- else if .Values.global.url }}
    - name: KC_HOSTNAME
      value: "{{ .Values.global.url }}/auth"
    - name: KC_HOSTNAME_URL
      value: "{{ .Values.global.url }}/auth"
    - name: KC_FRONTEND_URL
      value: "{{ .Values.global.url }}/auth"
    {{- end }}
    {{- else }}
    - name: KC_HOSTNAME_STRICT
      value: "false"
    - name: KC_PROXY_HEADERS
      value: "forwarded"
    {{- end }}
    - name: KC_HOSTNAME_STRICT_HTTPS
      value: "{{ .Values.global.tls.enabled }}"
    {{- if and .Values.global.tls.enabled .Values.global.url }}
    - name: KC_HOSTNAME_ADMIN_URL
      value: "{{ .Values.global.url }}/auth"
    {{- end }}

  extraVolumes: |
    - name: keycloak-data
      persistentVolumeClaim:
        claimName: keycloak-data

  extraVolumeMounts: |
    - name: keycloak-data
      mountPath: /opt/keycloak/data

  health:
    enabled: true

  startupProbe: |
    httpGet:
      path: '{{ tpl .Values.http.relativePath $ | trimSuffix "/" }}/health/started'
      port: '{{ .Values.http.internalPort }}'
      scheme: '{{ .Values.http.internalScheme }}'
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 30

datadog:
  enabled: true
  clusterAgent:
    enabled: false
  datadog:
    processAgent:
      enabled: false
    tags:
      - "env:on-prem"
    logs:
      enabled: true
      containerCollectAll: false
    env:
      # Drop high-volume, low-value logs at the Agent before ingestion to cut Datadog cost:
      # per-request access logs ("request completed", incl. kube-probe healthChecks) and the
      # expected 401 auth rejections logged at ERROR with full stack traces ("No token provided").
      - name: DD_LOGS_CONFIG_PROCESSING_RULES
        value: '[{"type":"exclude_at_match","name":"exclude_access_logs","pattern":"request completed"},{"type":"exclude_at_match","name":"exclude_no_token_errors","pattern":"No token provided"}]'
    apiKeyExistingSecret: datadog-secret
    appKeyExistingSecret: datadog-secret
    site: datadoghq.com
