apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if or (empty .Values.global.target_namespace) .Values.global.namespacedInstall }}Role{{ else }}ClusterRole{{ end }}
metadata:
  name: node-server-role
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - list
      - get
      - create
      - delete
  - apiGroups:
      - ''
    resources:
      - pods
      - pods/log
    verbs:
      - list
      - get
  # kubectl describe (job log bundles) lists events; without this it prints "Events: <none>"
  - apiGroups:
      - ''
    resources:
      - events
    verbs:
      - list
      - get
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - create
      - delete
      - update
  - apiGroups:
      - ''
    resources:
      - configmaps
    verbs:
      - get
